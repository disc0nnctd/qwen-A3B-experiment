<body>
<div id="game-wrapper">
<div id="canvas-container"><canvas id="game-canvas" width="540" height="960"></canvas></div>

<div id="panel">
<h2>Physics Config</h2>

<div class="action-row"><button id="reset-btn">Reset to Tuned</button></div>

<div id="mode-section"><h3>Mode</h3><div class="mode-control">

<button id="mode-human" class="active">HUMAN</button>

<div class="slider-row"><label>Epsilon</label><input type="range" id="ai-epsilon" min="0" max="1" step="0.01" value="1"><span class="val" id="ai-epsilon-val">1.00</span></div>

<div class="slider-row"><label>Alpha</label><input type="range" id="ai-alpha" min="0.01" max="1" step="0.01" value="0.15"><span class="val" id="ai-alpha-val">0.15</span></div>

<script>

const PHYSICS_DEFAULTS = {
  gravity: 1300, flapVelocity: -470, maxFallSpeed: 500, horizontalSpeed: 240,
  jumpStyle: 0, impulseFrames: 9, birdRadius: 16,
  spikeWidth: 30, spikeHeight: 24, spikeAngle: 0,
  spikeCountMin: 2, spikeCountMax: 5, candyChance: 0.5,
};
const MODE = { HUMAN: 0, AI_TRAIN: 1, AI_PLAY: 2 };
const WALL_BORDER = 12;
const W = 540, H = 960;
const SLOT_COUNT = 11;
const SLOT_H = H / SLOT_COUNT;
const PHYSICS_DT = 1/60;
const PRESETS = {
  Tuned:       {gravity:4200, flapVelocity:-700, maxFallSpeed:850, horizontalSpeed:290, jumpStyle:0, impulseFrames:9, birdRadius:16, spikeWidth:30, spikeHeight:24, spikeAngle:0, spikeCountMin:2, spikeCountMax:5, candyChance:0.5},
  Balanced:    {gravity:2600, flapVelocity:-600, maxFallSpeed:750, horizontalSpeed:280, jumpStyle:0, impulseFrames:9, birdRadius:16, spikeWidth:30, spikeHeight:24, spikeAngle:0, spikeCountMin:2, spikeCountMax:5, candyChance:0.5},
  Floaty:      {gravity:1300, flapVelocity:-470, maxFallSpeed:500, horizontalSpeed:240, jumpStyle:0, impulseFrames:9, birdRadius:16, spikeWidth:30, spikeHeight:24, spikeAngle:0, spikeCountMin:2, spikeCountMax:5, candyChance:0.5},
  Twitchy:     {gravity:5000, flapVelocity:-620, maxFallSpeed:1000, horizontalSpeed:350, jumpStyle:0, impulseFrames:9, birdRadius:16, spikeWidth:30, spikeHeight:24, spikeAngle:0, spikeCountMin:2, spikeCountMax:5, candyChance:0.5},
  SpecLiteral: {gravity:1620, flapVelocity:-510, maxFallSpeed:600, horizontalSpeed:270, jumpStyle:0, impulseFrames:9, birdRadius:16, spikeWidth:30, spikeHeight:24, spikeAngle:0, spikeCountMin:2, spikeCountMax:5, candyChance:0.5},
  Broken:      {gravity:27, flapVelocity:-510, maxFallSpeed:600, horizontalSpeed:270, jumpStyle:0, impulseFrames:9, birdRadius:16, spikeWidth:30, spikeHeight:24, spikeAngle:0, spikeCountMin:2, spikeCountMax:5, candyChance:0.5},
};

let config = { ...PHYSICS_DEFAULTS };

function configFromDefaults() { return { ...PHYSICS_DEFAULTS }; }

function loadConfig() {
  try {
    const saved = localStorage.getItem('dtts_physics');
    if (saved) {
      const p = JSON.parse(saved);
      if (p && typeof p.gravity === 'number') {
        for (const k of Object.keys(PHYSICS_DEFAULTS)) {
          if (p[k] !== undefined) config[k] = p[k];
        }
        return true;
      }
    }
  } catch(e) {}
  return false;
}

function saveConfig() {
  try { localStorage.setItem('dtts_physics', JSON.stringify(config)); } catch(e) {}
}

function hashConfig(c) {
  return Object.keys(c).sort().map(k => k + '=' + c[k]).join('|');
}

function initGame() {
  bird = { x: W/2, y: H/2, vy: 0, vx: config.horizontalSpeed, alive: true };
  score = 0;
  spikes = [];
  candy = null;
  particles = [];
  scoreFlash = 0;
  gameOverAnim = { birdY: bird.y, alpha: 0, spin: 0 };
  gameMode = MODE.HUMAN;
  resetState();
}

function resetEpisode() {
  bird.x = W/2;
  bird.y = H/2;
  bird.vy = 0;
  bird.vx = config.horizontalSpeed;
  bird.alive = true;
  candy = null;
  particles = [];
  scoreFlash = 0;
  gameOverAnim = { birdY: bird.y, alpha: 0, spin: 0 };
  resetState();
}

function resetState() {
  bird.vy = 0;
  bird.vx = config.horizontalSpeed;
  bird.alive = true;
  candy = null;
  particles = [];
  scoreFlash = 0;
  gameOverAnim = { birdY: bird.y, alpha: 0, spin: 0 };
  spawnSpikeWall(W - WALL_BORDER);
  spawnCandy();
  spawnCapSpikes();
}

function spawnSpikeWall(x) {
  spikes = [];
  const dir = x < W/2 ? 1 : -1;
  const forbidden = new Set();
  forbidden.add(0);
  forbidden.add(SLOT_COUNT - 1);
  const clearance = config.spikeWidth / 2 + config.birdRadius + 8;
  for (let slot = 0; slot < SLOT_COUNT; slot++) {
    const slotCenter = SLOT_H * slot + SLOT_H / 2;
    if (Math.abs(bird.y - slotCenter) < clearance) {
      forbidden.add(slot);
    }
  }
  const allowed = [];
  for (let slot = 0; slot < SLOT_COUNT; slot++) {
    if (!forbidden.has(slot)) allowed.push(slot);
  }
  let minSpikes, maxSpikes;
  if (score <= 5) { minSpikes = 2; maxSpikes = 3; }
  else if (score <= 15) { minSpikes = 3; maxSpikes = 4; }
  else { minSpikes = 4; maxSpikes = 5; }
  const effectiveMin = Math.min(minSpikes, config.spikeCountMax);
  const effectiveMax = Math.max(maxSpikes, config.spikeCountMin);
  const maxCount = Math.max(effectiveMin, Math.min(effectiveMax, effectiveMin + Math.floor(Math.random() * (effectiveMax - effectiveMin + 1))));
  const count = Math.min(maxCount, allowed.length);
  for (let i = 0; i < count; i++) {
    const idx = Math.floor(Math.random() * allowed.length);
    const slot = allowed.splice(idx, 1)[0];
    const slotCenter = SLOT_H * slot + SLOT_H / 2;
    spikes.push({ x, y: slotCenter, dir, width: config.spikeWidth, height: config.spikeHeight, angle: config.spikeAngle });
  }
  return allowed;
}

function findAiTargetBucket() {
  if (gameMode !== MODE.AI_TRAIN && gameMode !== MODE.AI_PLAY) return;
  const targetX = bird.vx > 0 ? W - WALL_BORDER : WALL_BORDER;
  const allowed = [];
  for (let slot = 0; slot < SLOT_COUNT; slot++) {
    const slotCenter = SLOT_H * slot + SLOT_H / 2;
    if (Math.abs(bird.y - slotCenter) < config.spikeWidth / 2 + config.birdRadius + 8) continue;
    if (slot === 0 || slot === SLOT_COUNT - 1) continue;
    allowed.push({ slot, dist: Math.abs(bird.y - slotCenter) });
  }
  allowed.sort((a, b) => a.dist - b.dist);
  if (allowed.length > 0) {
    aiTargetBucket = allowed[0].slot;
  }
}

function spawnCapSpikes() {
  capSpikes = [];
  const playableWidth = W - 2 * WALL_BORDER;
  const count = Math.floor(playableWidth / config.spikeWidth);
  for (let i = 0; i < count; i++) {
    capSpikes.push({ x: WALL_BORDER + i * config.spikeWidth + config.spikeWidth/2, y: WALL_BORDER, dir: 1, width: config.spikeWidth, height: config.spikeHeight });
    capSpikes.push({ x: WALL_BORDER + i * config.spikeWidth + config.spikeWidth/2, y: H - WALL_BORDER, dir: -1, width: config.spikeWidth, height: config.spikeHeight });
  }
}

function spawnCandy() {
  if (candy && !candy.collected) return;
  candy = null;
  if (Math.random() > config.candyChance) return;
  const occupied = new Set();
  for (const s of spikes) occupied.add(Math.floor(s.y / SLOT_H));
  for (const s of capSpikes) occupied.add(Math.floor(s.y / SLOT_H));
  const allowed = [];
  for (let slot = 0; slot < SLOT_COUNT; slot++) {
    if (!occupied.has(slot)) allowed.push(slot);
  }
  if (allowed.length === 0) return;
  const slot = allowed[Math.floor(Math.random() * allowed.length)];
  const cx = spikes.some(s => s.dir === 1) ? WALL_BORDER + 40 : W - WALL_BORDER - 40;
  candy = { x: cx, y: SLOT_H * slot + SLOT_H/2, r: 8, collected: false, angle: 0 };
}

let capSpikes = [];
let bird = null;
let score = 0;
let spikes = [];
let candy = null;
let particles = [];
let scoreFlash = 0;
let gameOverAnim = { birdY: 0, alpha: 0, spin: 0 };
let gameMode = MODE.HUMAN;


function updatePhysics(dt) {
  if (!bird.alive) return;

  // Horizontal movement
  bird.x += bird.vx * dt;

  // Apply gravity
  bird.vy += config.gravity * dt;
  bird.vy = Math.min(bird.vy, config.maxFallSpeed);

  // Move bird
  bird.y += bird.vy * dt;

  // Ceiling/floor cap spikes collision
  for (const s of capSpikes) {
    if (capSpikeHit(s)) {
      gameOver();
      return;
    }
  }

  // Wall collision - bounce
  if (bird.x - config.birdRadius < WALL_BORDER) {
    bird.x = WALL_BORDER + config.birdRadius;
    score++;
    scoreFlash = 1;
    shakeScreen();
    bird.vx = Math.abs(bird.vx);
    spawnSpikeWall(W - WALL_BORDER);
    spawnCandy();
  } else if (bird.x + config.birdRadius > W - WALL_BORDER) {
    bird.x = W - WALL_BORDER - config.birdRadius;
    score++;
    scoreFlash = 1;
    shakeScreen();
    bird.vx = -Math.abs(bird.vx);
    spawnSpikeWall(WALL_BORDER);
    spawnCandy();
  }

  // Wall spike collision
  for (const s of spikes) {
    if (wallSpikeHit(s)) {
      gameOver();
      return;
    }
  }

  // Candy collision
  if (candy && !candy.collected) {
    const dx = bird.x - candy.x;
    const dy = bird.y - candy.y;
    if (Math.sqrt(dx*dx + dy*dy) < config.birdRadius + candy.r) {
      candy.collected = true;
      score += 5;
      scoreFlash = 1;
      for (let i = 0; i < 12; i++) {
        particles.push({ x: candy.x, y: candy.y, vx: (Math.random()-0.5)*200, vy: (Math.random()-0.5)*200, life: 1, decay: 1.5, type: 'candy', r: 3 });
      }
    }
  }
}

function wallSpikeHit(s) {
  const dir = s.dir;
  const depth = (bird.x - s.x) * dir;
  if (depth + config.birdRadius < 0 || depth - config.birdRadius > s.height) return false;
  const d = Math.max(0, Math.min(depth - config.birdRadius, s.height - config.birdRadius));
  const angleRad = s.angle * Math.PI / 180;
  const apexOffset = Math.tan(angleRad) * s.height;
  const halfH = (s.width / 2) * (1 - d / s.height) + Math.abs(apexOffset) * (1 - d / s.height) * 0.5;
  const dy = bird.y - s.y;
  return Math.abs(dy) < halfH + config.birdRadius;
}

function capSpikeHit(s) {
  const dy = bird.y - s.y;
  if (s.dir < 0) {
    if (dy + config.birdRadius < -s.height || dy - config.birdRadius > 0) return false;
    const d = Math.max(0, Math.min(dy - config.birdRadius, s.height - config.birdRadius));
    const halfW = (s.width / 2) * (1 - d / s.height);
    const dx = bird.x - s.x;
    return Math.abs(dx) < halfW + config.birdRadius;
  } else {
    if (dy + config.birdRadius < 0 || dy - config.birdRadius > s.height) return false;
    const d = Math.max(0, Math.min(dy - config.birdRadius, s.height - config.birdRadius));
    const halfW = (s.width / 2) * (1 - d / s.height);
    const dx = bird.x - s.x;
    return Math.abs(dx) < halfW + config.birdRadius;
  }
}

function gameOver() {
  bird.alive = false;
  gameOverAnim.birdY = bird.y;
  gameOverAnim.alpha = 0;
  gameOverAnim.spin = 0;
  shakeScreen();
}

function shakeScreen() {
  shakeFrames = 8;
  shakeX = (Math.random() - 0.5) * 10;
  shakeY = (Math.random() - 0.5) * 10;
}

let shakeFrames = 0, shakeX = 0, shakeY = 0;


const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

function draw() {
  ctx.save();
  ctx.translate(shakeFrames > 0 ? shakeX : 0, shakeFrames > 0 ? shakeY : 0);
  ctx.fillStyle = '#ecf0f1';
  ctx.fillRect(-10, -10, W + 20, H + 20);

  // Wall borders
  ctx.fillStyle = '#34495e';
  ctx.fillRect(0, 0, WALL_BORDER, H);
  ctx.fillRect(W - WALL_BORDER, 0, WALL_BORDER, H);

  // Ceiling and floor
  ctx.fillRect(0, 0, W, WALL_BORDER);
  ctx.fillRect(0, H - WALL_BORDER, W, WALL_BORDER);

  // Cap spikes
  for (const s of capSpikes) {
    drawCapSpike(s);
  }

  // Wall spikes
  for (const s of spikes) {
    drawWallSpike(s);
  }

  // Candy
  if (candy && !candy.collected) {
    drawCandy();
  }

  // Bird
  if (bird) {
    drawBird();
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.type === 'candy' ? '#ffeb3b' : '#e74c3c';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Score flash
  if (scoreFlash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (scoreFlash * 0.4) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // Score watermark
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.font = 'bold 120px Segoe UI';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(score), W/2, H/2);

  // AI decision indicator
  if (gameMode !== MODE.HUMAN && bird.alive) {
    if (aiFlashFrame > 0) {
      ctx.strokeStyle = 'rgba(79,195,247,' + (aiFlashFrame * 0.8) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(bird.x, bird.y, config.birdRadius + 8, 0, Math.PI * 2);
      ctx.stroke();
      aiFlashFrame -= 0.05;
    }
    if (aiTargetBucket !== null) {
      const targetY = SLOT_H * aiTargetBucket + SLOT_H / 2;
      ctx.strokeStyle = 'rgba(76,175,80,0.6)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(0, targetY);
      ctx.lineTo(W, targetY);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  ctx.restore();
}

function drawWallSpike(s) {
  const angleRad = s.angle * Math.PI / 180;
  const apexOffset = Math.tan(angleRad) * s.height;
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  const baseX = s.x;
  const baseTopY = s.y - s.width / 2;
  const baseBotY = s.y + s.width / 2;
  const apexX = s.x + s.dir * s.height;
  const apexY = s.y + apexOffset;
  ctx.moveTo(baseX, baseTopY);
  ctx.lineTo(baseX, baseBotY);
  ctx.lineTo(apexX, apexY);
  ctx.closePath();
  ctx.fill();
}

function drawCapSpike(s) {
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.moveTo(s.x - s.width / 2, s.y);
  ctx.lineTo(s.x + s.width / 2, s.y);
  ctx.lineTo(s.x, s.y + s.dir * s.height);
  ctx.closePath();
  ctx.fill();
}

function drawBird() {
  ctx.fillStyle = '#3498db';
  ctx.beginPath();
  ctx.arc(bird.x, bird.y, config.birdRadius, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#2980b9';
  ctx.beginPath();
  ctx.arc(bird.x, bird.y, config.birdRadius * 0.6, 0, Math.PI * 2);
  ctx.fill();
}

function drawCandy() {
  if (!candy || candy.collected) return;
  candy.angle += 0.05;
  const pulse = 1 + Math.sin(candy.angle * 3) * 0.15;
  const r = candy.r * pulse;
  ctx.save();
  ctx.translate(candy.x, candy.y);
  ctx.rotate(candy.angle);
  ctx.fillStyle = '#ffeb3b';
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.lineTo(r, 0);
  ctx.lineTo(0, r);
  ctx.lineTo(-r, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#f57f17';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

let aiFlashFrame = 0;


// Tabular Q-learning agent
let qTable = null;
let aiEpsilon = 1.0;
let aiAlpha = 0.15;
let aiGamma = 0.98;
let aiEpisode = 0;
let aiTotalSteps = 0;
let aiCurrentScore = 0;
let aiBestScore = 0;
let aiScores = [];
let aiStatesVisited = new Set();
let trainedPhysicsHash = null;
let aiTargetBucket = null;
let aiLastAction = -1;
let aiLearning = false;
let aiQUpdates = 0;

// Per-step trace so the graph moves every frame instead of once per episode.
const LIVE_TRACE_MAX = 240;
let aiLiveTrace = [];

// RL step inspector variables
let aiStepEpisode = 0;
let aiStepStep = 0;
let aiStepDx = -1, aiStepDy = -1, aiStepVy = -1, aiStepDs = -1, aiStepDir = -1;
let aiStepStateIdx = -1;
let aiStepAction = -1;
let aiStepIsExplore = false;
let aiStepQ0 = 0, aiStepQ1 = 0;
let aiStepReward = 0;
let aiStepTdError = 0;

// Step log ring buffer
const LOG_MAX = 200;
let aiLogPaused = false;
let aiLogBuffer = [];
let aiLogSeq = 0;
let lastSaveError = '';
let aiLogRendered = -1;

const Q_BUCKETS = {
  dxBuckets: 12,
  dyBuckets: [8,24,48,80,128,192,288,480],
  vyBuckets: [60,180,360,600],
  spikeBuckets: [8,24,48,80,128,192,288,480],
};

// Derived, never hardcoded: a signed bucketer over n thresholds yields 2n+1
// values and an unsigned one yields n+1. Editing a threshold list above now
// resizes the table correctly instead of silently overflowing it.
const Q_SIZES = [
  Q_BUCKETS.dxBuckets,                    // dx, linear, 12
  2 * Q_BUCKETS.dyBuckets.length + 1,     // dy, signed,   17
  2 * Q_BUCKETS.vyBuckets.length + 1,     // vy, signed,    9
  Q_BUCKETS.spikeBuckets.length + 1,      // ds, unsigned,  9
  2                                       // dir
];
const Q_NUM_STATES = Q_SIZES.reduce((a, b) => a * b, 1);

function initQTable() {
  const numStates = Q_NUM_STATES;
  qTable = new Float32Array(numStates * 2);
  aiStatesVisited = new Set();
}

function mixRadixKey(dx, dy, vy, ds, dir) {
  const sizes = Q_SIZES;
  return dx + dy*sizes[0] + vy*sizes[0]*sizes[1] + ds*sizes[0]*sizes[1]*sizes[2] + dir*sizes[0]*sizes[1]*sizes[2]*sizes[3];
}

function dxBucket() {
  const dist = bird.vx > 0 ? W - WALL_BORDER - config.birdRadius - bird.x : bird.x - WALL_BORDER - config.birdRadius;
  return Math.max(0, Math.min(Q_BUCKETS.dxBuckets - 1, Math.floor(dist / (W - 2*WALL_BORDER) * Q_BUCKETS.dxBuckets)));
}

function clampBucket(val, thresholds) {
  const n = thresholds.length;
  const a = Math.abs(val);
  let band = n;
  for (let i = 0; i < n; i++) {
    if (a <= thresholds[i]) { band = i; break; }
  }
  return val < 0 ? n - band : n + band;
}

function magnitudeBucket(val, thresholds) {
  const n = thresholds.length;
  const a = Math.abs(val);
  for (let i = 0; i < n; i++) {
    if (a <= thresholds[i]) return i;
  }
  return n;
}

function dyBucket() {
  const target = aiTargetBucket ?? 0;
  const targetY = SLOT_H * target + SLOT_H/2;
  const dist = bird.y - targetY;
  return clampBucket(dist, Q_BUCKETS.dyBuckets);
}

function vyBucket() {
  return clampBucket(Math.max(-900, Math.min(900, bird.vy)), Q_BUCKETS.vyBuckets);
}

function dySpikeBucket() {
  let minDist = Infinity;
  for (const s of spikes) {
    const dist = Math.abs(bird.y - s.y);
    if (dist < minDist) minDist = dist;
  }
  return magnitudeBucket(minDist, Q_BUCKETS.spikeBuckets);
}

function dirBit() {
  return bird.vx > 0 ? 1 : 0;
}

function getStateKey() {
  const dx = dxBucket();
  const dy = dyBucket();
  const vy = vyBucket();
  const ds = dySpikeBucket();
  const d = dirBit();
  const key = mixRadixKey(dx, dy, vy, ds, d);
  aiStatesVisited.add(key);
  return Math.max(0, Math.min(Q_NUM_STATES - 1, key));
}

function getBestAction(state) {
  const base = state * 2;
  const a0 = qTable[base];
  const a1 = qTable[base + 1];
  return a1 >= a0 ? 1 : 0;
}

function chooseAction(state) {
  const isExplore = aiEpsilon > Math.random();
  let action;
  if (isExplore) {
    action = Math.random() < 0.5 ? 0 : 1;
  } else {
    action = getBestAction(state);
  }
  // Record Q values before update
  const base = state * 2;
  aiStepQ0 = qTable[base];
  aiStepQ1 = qTable[base + 1];
  aiStepIsExplore = isExplore;
  return action;
}

function updateQ(state, action, reward, nextState, done) {
  const stateIdx = state * 2 + action;
  const oldQ = qTable[stateIdx];
  let target;
  if (done) {
    target = reward;
  } else {
    const bestNext = getBestAction(nextState);
    target = reward + aiGamma * qTable[nextState * 2 + bestNext];
  }
  qTable[stateIdx] += aiAlpha * (target - oldQ);
  aiQUpdates++;
  // Record TD error
  aiStepTdError = target - oldQ;
}

function computeEpsilon() {
  const EPS_MIN = 0.02;
  const EPS_EPISODES = 1500;
  const k = Math.log(1 / EPS_MIN) / EPS_EPISODES;
  if (aiEpisode < EPS_EPISODES) {
    return Math.max(EPS_MIN, Math.exp(-k * aiEpisode));
  }
  return EPS_MIN;
}

function updateAI() {
  if (!qTable) initQTable();
  if (!bird.alive) return;

  const state = getStateKey();
  const action = chooseAction(state);
  aiLastAction = action;

  // Action 1 is FLAP: apply it before stepping the physics, exactly as the
  // human input handlers do, so the agent's two actions actually differ.
  if (action === 1 && bird.alive) {
    bird.vy = config.flapVelocity;
  }

  // Populate step inspector variables
  aiStepEpisode = aiEpisode;
  aiStepStep = aiCurrentScore;
  aiStepDx = dxBucket();
  aiStepDy = dyBucket();
  aiStepVy = vyBucket();
  aiStepDs = dySpikeBucket();
  aiStepDir = dirBit();
  aiStepStateIdx = state;
  aiStepAction = action;
  aiStepReward = 0.1;
  aiStepTdError = 0;

  updatePhysics(PHYSICS_DT);
  findAiTargetBucket();

  let reward = 0.1;
  let done = false;

  if (!bird.alive) {
    reward = -100;
    done = true;
    aiStepReward = reward;
  } else if (bird.vx > 0 && bird.x + config.birdRadius > W - WALL_BORDER) {
    reward = 10;
    aiStepReward = reward;
  } else if (bird.vx < 0 && bird.x - config.birdRadius < WALL_BORDER) {
    reward = 10;
    aiStepReward = reward;
  }

  if (candy && !candy.collected) {
    const dx2 = bird.x - candy.x;
    const dy2 = bird.y - candy.y;
    if (Math.sqrt(dx2*dx2 + dy2*dy2) < config.birdRadius + candy.r) {
      reward += 5;
      aiStepReward += 5;
    }
  }

  const nextState = getStateKey();

  // Only update Q-table in TRAIN mode; PLAY mode is observation-only
  if (aiLearning) {
    updateQ(state, action, reward, nextState, done);
  }

  if (done) {
    aiScores.push(aiCurrentScore);
    if (aiCurrentScore > aiBestScore) aiBestScore = aiCurrentScore;
    aiEpisode++;
    aiEpsilon = computeEpsilon();
    aiCurrentScore = 0;
    aiTargetBucket = null;
    aiLastAction = -1;
    if (aiEpisode % 50 === 0) saveRunAndReport();
    resetEpisode();
  } else {
    aiCurrentScore++;
    aiLiveTrace.push(aiCurrentScore);
    if (aiLiveTrace.length > LIVE_TRACE_MAX) aiLiveTrace.shift();
    aiTotalSteps++;
  }

  aiFlashFrame = action === 1 ? 1 : 0;
}

function resetAI() {
  aiCurrentScore = 0;
  aiTargetBucket = null;
  aiLastAction = -1;
}

function pushStepLog() {
  const ep = aiStepEpisode;
  const step = aiStepStep;
  const stateIdx = aiStepStateIdx;
  const action = aiStepAction;
  const reward = aiStepReward;
  const td = aiStepTdError;

  let rewardClass = '';
  if (reward > 0) rewardClass = 'log-reward-pos';
  else if (reward < -1) rewardClass = 'log-reward-epic';
  else if (reward < 0) rewardClass = 'log-reward-neg';

  let actionClass = action === 1 ? 'log-action-flap' : 'log-action-noop';
  let actionLabel = action === 1 ? 'FLAP' : 'NOOP';

  const line = document.createElement('div');
  line.className = 'log-line';
  line.innerHTML = '<span class="' + actionClass + '">' + actionLabel + '</span> ' +
    'ep:' + ep + ' s:' + step + ' Q0:' + aiStepQ0.toFixed(3) + ' Q1:' + aiStepQ1.toFixed(3) +
    ' R=' + reward.toFixed(1) + ' ' +
    '<span class="' + rewardClass + '">TD=' + td.toFixed(3) + '</span>';

  aiLogBuffer.push(line);
  if (aiLogBuffer.length > LOG_MAX) aiLogBuffer.shift();
  aiLogSeq++;
}

function renderStepLog() {
  if (aiLogPaused) return;
  const logEl = document.getElementById('rl-log');
  if (!logEl) return;

  // Only update if there are new steps
  if (aiLogSeq === aiLogRendered) return;
  aiLogRendered = aiLogSeq;

  // Append only the newest line, then trim from the front
  const newest = aiLogBuffer[aiLogBuffer.length - 1];
  if (newest) logEl.appendChild(newest.cloneNode(true));
  while (logEl.childElementCount > LOG_MAX) logEl.removeChild(logEl.firstChild);

  // Auto-scroll to bottom
  logEl.scrollTop = logEl.scrollHeight;
}

function renderRLInspector() {
  const epEl = document.getElementById('rl-ep');
  const stepEl = document.getElementById('rl-step');
  const stateEl = document.getElementById('rl-state');
  const actionEl = document.getElementById('rl-action');
  const rewardEl = document.getElementById('rl-reward');
  const tdEl = document.getElementById('rl-td');
  const q0El = document.getElementById('rl-q0');
  const q1El = document.getElementById('rl-q1');
  const modeEl = document.getElementById('rl-mode');

  if (!epEl || !stepEl || !stateEl || !actionEl || !rewardEl || !tdEl || !q0El || !q1El) return;

  if (modeEl) {
    modeEl.textContent = gameMode === MODE.AI_TRAIN ? 'TRAIN' : 'PLAY';
  }

  epEl.textContent = aiStepEpisode;
  stepEl.textContent = aiStepStep;
  stateEl.textContent = 'dx=' + aiStepDx + ' dy=' + aiStepDy + ' vy=' + aiStepVy + ' ds=' + aiStepDs + ' dir=' + aiStepDir + ' idx=' + aiStepStateIdx;

  let actionHtml = aiStepAction === 1 ? 'FLAP' : 'NOOP';
  if (aiStepIsExplore) {
    actionHtml += ' <span class="rl-explore">[EXPLORE]</span>';
  } else {
    actionHtml += ' <span class="rl-greedy">[GREEDY]</span>';
  }
  actionEl.innerHTML = actionHtml;

  rewardEl.innerHTML = '<span class="rl-reward">' + aiStepReward.toFixed(1) + '</span>';
  tdEl.innerHTML = '<span class="rl-td">' + aiStepTdError.toFixed(3) + '</span>';
  q0El.textContent = aiStepQ0.toFixed(3);
  q1El.textContent = aiStepQ1.toFixed(3);
}

// Save/load full run
function saveRun() {
  try {
    const run = {
      version: 2,
      physics: hashConfig(config),
      episode: aiEpisode,
      totalSteps: aiTotalSteps,
      bestScore: aiBestScore,
      scores: aiScores.slice(-5000),
      alpha: aiAlpha,
      gamma: aiGamma,
      qtable: Array.from(qTable)
    };
    const str = JSON.stringify(run);
    localStorage.setItem('dtts_run', str);
    return str.length;
  } catch(e) {
    lastSaveError = String(e && e.message ? e.message : e);
    return -1;
  }
}

function saveRunAndReport() {
  const n = saveRun();
  const statusEl = document.getElementById('save-status');
  if (statusEl) {
    statusEl.textContent = n > 0
      ? 'saved ep ' + aiEpisode + ', ' + n + ' chars'
      : 'SAVE FAILED: ' + lastSaveError;
  }
  return n;
}

function loadRun() {
  try {
    const saved = localStorage.getItem('dtts_run');
    if (!saved) return false;
    const run = JSON.parse(saved);
    if (!run || !run.qtable) return false;
    const expectedSize = Q_NUM_STATES * 2;
    if (run.qtable.length === expectedSize) {
      qTable = new Float32Array(run.qtable);
    } else {
      initQTable();
    }
    trainedPhysicsHash = run.physics || null;
    aiEpisode = run.episode || 0;
    aiTotalSteps = run.totalSteps || 0;
    aiBestScore = run.bestScore || 0;
    aiScores = run.scores || [];
    aiAlpha = run.alpha != null ? run.alpha : aiAlpha;
    aiGamma = run.gamma != null ? run.gamma : aiGamma;
    return true;
  } catch(e) {
    return false;
  }
}

function loadQTable() {
  try {
    const saved = localStorage.getItem('dtts_qtable');
    if (saved) {
      const p = JSON.parse(saved);
      if (p && p.physics && p.data) {
        trainedPhysicsHash = p.physics;
        aiEpisode = p.episode || 0;
    const expectedSize = Q_NUM_STATES * 2;
        if (p.data.length === expectedSize) {
          qTable = new Float32Array(p.data);
        } else {
          initQTable();
        }
        return true;
      }
    }
  } catch(e) {}
  return false;
}

function exportPolicy() {
  const data = { version: 2, physics: hashConfig(config), episode: aiEpisode, totalSteps: aiTotalSteps, bestScore: aiBestScore, scores: aiScores.slice(-5000), alpha: aiAlpha, gamma: aiGamma, data: Array.from(qTable) };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'dtts_policy.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importPolicy(data) {
  try {
    const p = JSON.parse(data);
    const expectedSize = Q_NUM_STATES * 2;
    if (p && p.data) {
      if (p.version === 2) {
        if (p.data.length === expectedSize) {
          qTable = new Float32Array(p.data);
        } else {
          initQTable();
        }
        trainedPhysicsHash = p.physics || null;
        aiEpisode = p.episode || 0;
        aiTotalSteps = p.totalSteps || 0;
        aiBestScore = p.bestScore || 0;
        aiScores = p.scores || [];
        aiAlpha = p.alpha != null ? p.alpha : aiAlpha;
        aiGamma = p.gamma != null ? p.gamma : aiGamma;
        return true;
      } else {
        // old format: { physics, episode, data }
        trainedPhysicsHash = p.physics;
        aiEpisode = p.episode || 0;
        if (p.data.length === expectedSize) {
          qTable = new Float32Array(p.data);
        } else {
          initQTable();
        }
        return true;
      }
    }
  } catch(e) {}
  return false;
}

function resetPolicy() {
  if (confirm('Reset the Q-table?')) {
    initQTable();
    localStorage.removeItem('dtts_qtable');
    trainedPhysicsHash = null;
  }
}


function updateDerivedValues() {
  const jumpH = config.flapVelocity * config.flapVelocity / (2 * config.gravity);
  const apexTime = Math.abs(config.flapVelocity) / config.gravity;
  const hPerJump = config.horizontalSpeed * 2 * apexTime;
  const crossTime = (W - 2*WALL_BORDER) / config.horizontalSpeed;
  const tapsPerCross = crossTime / (2 * apexTime);
  const terminalTime = config.maxFallSpeed / config.gravity;
  const terminalDist = config.maxFallSpeed * config.maxFallSpeed / (2 * config.gravity);
  const clearance = SLOT_H - config.spikeWidth - 2 * config.birdRadius;

  const el = document.getElementById('derived');
  el.innerHTML = '';

  const rows = [
    ['Jump height', formatVal(jumpH, 'px', jumpH > 960 ? 'red' : (jumpH > 300 ? 'amber' : 'green'))],
    ['Time to apex', formatVal(apexTime, 's')],
    ['H travel/jump', formatVal(hPerJump, 'px')],
    ['Crossing time', formatVal(crossTime, 's')],
    ['Taps/crossing', formatVal(tapsPerCross, '', tapsPerCross < 2 ? 'red' : (tapsPerCross > 8 ? 'amber' : 'green'))],
    ['Terminal vel time', formatVal(terminalTime, 's')],
    ['Terminal fall dist', formatVal(terminalDist, 'px')],
    ['Gap clearance', formatVal(clearance, 'px', clearance <= 0 ? 'red-bg' : 'green')],
  ];

  for (const [label, val] of rows) {
    el.innerHTML += '<div class="derived-row"><span class="label">' + label + '</span><span class="value ' + val[1] + '">' + val[0] + '</span></div>';
  }
}

function formatVal(v, unit, cls) {
  if (typeof v === 'string') return [v, cls];
  const s = v.toFixed(1);
  return [s + (unit ? ' ' + unit : ''), cls];
}

function buildSliders() {
  const params = [
    ['gravity', 'Gravity', 200, 5000, 10],
    ['flapVelocity', 'Flap Vel', -1200, -100, 5],
    ['maxFallSpeed', 'Max Fall', 150, 2000, 10],
    ['horizontalSpeed', 'H-Speed', 60, 900, 5],
    ['jumpStyle', 'Jump Style', 0, 1, 1],
    ['impulseFrames', 'Impulse Frames', 1, 20, 1],
    ['birdRadius', 'Bird Radius', 6, 40, 1],
    ['spikeWidth', 'Spike Width', 10, 60, 1],
    ['spikeHeight', 'Spike Height', 8, 60, 1],
    ['spikeAngle', 'Spike Angle', -45, 45, 1],
    ['spikeCountMin', 'Min Spikes', 0, 9, 1],
    ['spikeCountMax', 'Max Spikes', 0, 9, 1],
    ['candyChance', 'Candy Chance', 0, 1, 0.05],
  ];

  const el = document.getElementById('sliders');
  for (const [key, label, min, max, step] of params) {
    const val = config[key];
    const row = document.createElement('div');
    row.className = 'slider-row';
    row.innerHTML = '<label>' + label + '</label>';
    if (key === 'jumpStyle') {
      row.innerHTML += '<input type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '" data-key="' + key + '">';
      row.innerHTML += '<span class="val">' + (val === 0 ? 'instant' : 'impulse') + '</span>';
    } else {
      row.innerHTML += '<input type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '" data-key="' + key + '">';
      row.innerHTML += '<input type="number" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '" data-key="' + key + '">';
      row.innerHTML += '<span class="val">' + val.toFixed(step < 1 ? 2 : 0) + '</span>';
    }
    el.appendChild(row);
  }
}

function buildPresets() {
  const el = document.getElementById('presets');
  for (const name of Object.keys(PRESETS)) {
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.onclick = () => applyPreset(name);
    el.appendChild(btn);
  }
}

function applyPreset(name) {
  const p = PRESETS[name];
  for (const k of Object.keys(p)) config[k] = p[k];
  updateSliderDisplays();
  saveConfig();
  updateDerivedValues();
}

function updateSliderDisplays() {
  const sliders = document.querySelectorAll('#sliders input[type=range]');
  const inputs = document.querySelectorAll('#sliders input[type=number]');
  const vals = document.querySelectorAll('#sliders .val');
  for (let i = 0; i < sliders.length; i++) {
    const key = sliders[i].dataset.key;
    sliders[i].value = config[key];
    if (key !== 'jumpStyle') {
      inputs[i].value = config[key];
    }
    if (key === 'jumpStyle') {
      vals[i].textContent = config[key] === 0 ? 'instant' : 'impulse';
    } else {
      vals[i].textContent = config[key].toFixed(sliders[i].step < 1 ? 2 : 0);
    }
  }
}

function clampSliders() {
  const min = parseInt(document.querySelector('#sliders input[data-key="spikeCountMin"]').value);
  const max = parseInt(document.querySelector('#sliders input[data-key="spikeCountMax"]').value);
  if (min > max) {
    document.querySelector('#sliders input[data-key="spikeCountMax"]').value = min;
    config.spikeCountMax = min;
  }
}

function updateMetrics() {
  const el = document.getElementById('metrics');
  if (!el) return;
  el.innerHTML = '';
  const metrics = [
    ['Episode', aiEpisode],
    ['Total steps', aiTotalSteps],
    ['Epsilon', aiEpsilon.toFixed(3)],
    ['Score', aiCurrentScore],
    ['Best', aiBestScore],
    ['States visited', aiStatesVisited.size],
    ['Learning', aiLearning ? 'ON' : 'OFF (not updating Q)'],
    ['Q updates', aiQUpdates],
  ];
  if (aiScores.length > 0) {
    const last50 = aiScores.slice(-50);
    const mean = last50.reduce((a,b) => a+b, 0) / last50.length;
    metrics.push(['Mean (50)', mean.toFixed(1)]);
  }
  for (const [label, val] of metrics) {
    el.innerHTML += '<div class="metric">' + label + ': <span class="metric-val">' + val + '</span></div>';
  }
}

function drawSparkline() {
  const el = document.getElementById('sparkline-canvas');
  if (!el) return;
  const c = el.getContext('2d');
  const w = el.width, h = el.height;
  c.clearRect(0, 0, w, h);

  // Window to the most recent episodes. Plotting the entire history compressed
  // every new episode into well under a pixel, which is why it looked frozen.
  const VIEW = 200;
  const view = aiScores.slice(-VIEW);

  // Live per-step trace along the bottom third: this is what moves every frame.
  if (aiLiveTrace.length > 1) {
    const lmax = Math.max(5, ...aiLiveTrace);
    const lstep = w / (LIVE_TRACE_MAX - 1);
    c.strokeStyle = 'rgba(255,235,59,0.55)';
    c.lineWidth = 1;
    c.beginPath();
    for (let i = 0; i < aiLiveTrace.length; i++) {
      const x = i * lstep;
      const y = h - (aiLiveTrace[i] / lmax) * h * 0.30;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.stroke();
  }

  if (view.length < 2) return;

  const maxScore = Math.max(5, ...view);
  const step = w / Math.max(1, view.length - 1);

  // Raw per-episode scores over the window.
  c.strokeStyle = 'rgba(79,195,247,0.25)';
  c.lineWidth = 1;
  c.beginPath();
  for (let i = 0; i < view.length; i++) {
    const x = i * step;
    const y = h - (view[i] / maxScore) * h * 0.9;
    if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
  }
  c.stroke();

  // Moving average, computed with a running sum in a single pass instead of
  // recomputing each window from scratch every frame.
  const window = 50;
  if (view.length >= window) {
    c.strokeStyle = 'rgba(79,195,247,0.95)';
    c.lineWidth = 2;
    c.beginPath();
    let sum = 0;
    for (let i = 0; i < window; i++) sum += view[i];
    for (let i = window - 1; i < view.length; i++) {
      if (i >= window) sum += view[i] - view[i - window];
      const avg = sum / window;
      const x = i * step;
      const y = h - (avg / maxScore) * h * 0.9;
      if (i === window - 1) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.stroke();
  }
}

function checkPolicyBanner() {
  const banner = document.getElementById('policy-banner');
  if (!banner) return;
  if (trainedPhysicsHash && trainedPhysicsHash !== hashConfig(config)) {
    banner.innerHTML = '<div class="banner amber">Policy was trained under different physics — expect degraded play. Retrain or reset.</div>';
  } else {
    banner.innerHTML = '';
  }
}

let prevMode = null;

function switchMode(newMode) {
  if (newMode === prevMode) return;
  prevMode = newMode;
  document.getElementById('mode-human').classList.toggle('active', newMode === MODE.HUMAN);
  document.getElementById('mode-ai-train').classList.toggle('active', newMode === MODE.AI_TRAIN);
  document.getElementById('mode-ai-play').classList.toggle('active', newMode === MODE.AI_PLAY);
  document.getElementById('ai-section').style.display = newMode === MODE.HUMAN ? 'none' : 'block';
  gameMode = newMode;
  if (newMode === MODE.AI_TRAIN || newMode === MODE.AI_PLAY) {
    if (!qTable) initQTable();
    document.getElementById('rl-inspector').style.display = 'none';
    document.getElementById('rl-log-section').style.display = 'none';
  }
}

function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);

  if (shakeFrames > 0) {
    shakeFrames--;
    shakeX = (Math.random() - 0.5) * 10;
    shakeY = (Math.random() - 0.5) * 10;
  }

  if (gameMode === MODE.HUMAN) {
    if (!bird || !bird.alive) {
      gameOverAnim.alpha = Math.min(1, gameOverAnim.alpha + 0.02);
      gameOverAnim.birdY += 600 * PHYSICS_DT;
      gameOverAnim.spin += 2.0 * PHYSICS_DT;
      if (gameOverAnim.alpha >= 0.6) {
        ctx.fillStyle = 'rgba(0,0,0,' + (gameOverAnim.alpha * 0.6) + ')';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over', W/2, H/2 - 80);
        ctx.font = '24px Segoe UI';
        ctx.fillText('Score: ' + score, W/2, H/2 - 30);
        ctx.save();
        ctx.translate(W/2, gameOverAnim.birdY);
        ctx.rotate(gameOverAnim.spin);
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = '#4fc3f7';
        ctx.font = '20px Segoe UI';
        ctx.fillText('Tap to Play Again', W/2, H/2 + 60);
        return;
      }
    } else {
      updatePhysics(PHYSICS_DT);
      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * PHYSICS_DT;
        p.y += p.vy * PHYSICS_DT;
        p.life -= p.decay * PHYSICS_DT;
        if (p.type === 'candy') p.vy += 50 * PHYSICS_DT;
        if (p.life <= 0) particles.splice(i, 1);
      }
      scoreFlash *= Math.pow(0.9, PHYSICS_DT * 60);
      if (scoreFlash < 0.01) scoreFlash = 0;
    }
  } else if (gameMode === MODE.AI_TRAIN || gameMode === MODE.AI_PLAY) {
    const turbo = document.getElementById('turbo-check') && document.getElementById('turbo-check').checked;
    const stepsPerFrame = turbo ? Math.max(1, Math.round(2 ** Math.log2(parseInt(document.getElementById('turbo-steps').value)))) : 1;
    for (let s = 0; s < stepsPerFrame; s++) {
      updateAI();
    }
    pushStepLog();
  }

  // Animate game over overlay (AI modes only, brief) — do NOT return early
  if (bird && !bird.alive && (gameMode === MODE.AI_TRAIN || gameMode === MODE.AI_PLAY)) {
    gameOverAnim.alpha = Math.min(1, gameOverAnim.alpha + 0.02);
    gameOverAnim.birdY += 600 * PHYSICS_DT;
    gameOverAnim.spin += 2.0 * PHYSICS_DT;
    if (gameOverAnim.alpha >= 0.6) {
      ctx.fillStyle = 'rgba(0,0,0,' + (gameOverAnim.alpha * 0.6) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 36px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', W/2, H/2 - 80);
      ctx.font = '24px Segoe UI';
      ctx.fillText('Score: ' + aiCurrentScore, W/2, H/2 - 30);
      ctx.save();
      ctx.translate(W/2, gameOverAnim.birdY);
      ctx.rotate(gameOverAnim.spin);
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  draw();
  updateMetrics();
  drawSparkline();
  checkPolicyBanner();

  // Render RL inspector and step log every frame when in AI mode
  if (gameMode === MODE.AI_TRAIN || gameMode === MODE.AI_PLAY) {
    if (document.getElementById('rl-inspector')) {
      document.getElementById('rl-inspector').style.display = 'block';
    }
    if (document.getElementById('rl-log-section')) {
      document.getElementById('rl-log-section').style.display = 'block';
    }
    renderRLInspector();

    renderStepLog();
  }
}

// Input handlers
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'KeyA' || e.code === 'KeyD') {
    e.preventDefault();
    if (!bird || !bird.alive) {
      if (gameOverAnim.alpha >= 0.6) {
        initGame();
        return;
      }
    }
    if (gameMode === MODE.HUMAN && bird.alive) {
      if (config.jumpStyle === 0) {
        bird.vy = config.flapVelocity;
      } else if (config.jumpStyle === 1) {
        bird.vy = config.flapVelocity;
      }
    }
    if (gameMode === MODE.AI_TRAIN || gameMode === MODE.AI_PLAY) {
      aiLastAction = 1;
    }
  }
});

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

  if (!bird || !bird.alive) {
    if (gameOverAnim.alpha >= 0.6) {
      initGame();
      return;
    }
    return;
  }

  if (gameMode === MODE.HUMAN) {
    if (config.jumpStyle === 0) {
      bird.vy = config.flapVelocity;
    } else if (config.jumpStyle === 1) {
      bird.vy = config.flapVelocity;
    }
  }
  if (gameMode === MODE.AI_TRAIN || gameMode === MODE.AI_PLAY) {
    aiLastAction = 1;
  }
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (!bird || !bird.alive) {
    if (gameOverAnim.alpha >= 0.6) {
      initGame();
      return;
    }
    return;
  }
  if (gameMode === MODE.HUMAN) {
    if (config.jumpStyle === 0) {
      bird.vy = config.flapVelocity;
    } else if (config.jumpStyle === 1) {
      bird.vy = config.flapVelocity;
    }
  }
  if (gameMode === MODE.AI_TRAIN || gameMode === MODE.AI_PLAY) {
    aiLastAction = 1;
  }
}, { passive: false });

// Slider event listeners
document.getElementById('sliders').addEventListener('input', (e) => {
  const key = e.target.dataset.key;
  if (!key) return;
  const step = parseFloat(e.target.step);
  config[key] = parseFloat(e.target.value);
  if (e.target.type === 'range') {
    if (key !== 'jumpStyle') {
      const inputs = document.querySelectorAll('#sliders input[data-key="' + key + '"]');
      inputs.forEach(inp => {
        if (inp !== e.target) inp.value = config[key];
      });
    }
    const valEl = e.target.parentElement.querySelector('.val');
    if (key === 'jumpStyle') {
      if (valEl) valEl.textContent = config[key] === 0 ? 'instant' : 'impulse';
    } else if (valEl) {
      valEl.textContent = config[key].toFixed(step < 1 ? 2 : 0);
    }
  }
  saveConfig();
  updateDerivedValues();
  clampSliders();
});

document.getElementById('reset-btn').addEventListener('click', () => {
  config = { ...PHYSICS_DEFAULTS };
  updateSliderDisplays();
  saveConfig();
  updateDerivedValues();
});

document.getElementById('mode-human').addEventListener('click', () => switchMode(MODE.HUMAN));
document.getElementById('mode-ai-train').addEventListener('click', () => switchMode(MODE.AI_TRAIN));
document.getElementById('mode-ai-play').addEventListener('click', () => switchMode(MODE.AI_PLAY));

document.getElementById('start-learn-btn').addEventListener('click', () => {
  aiLearning = !aiLearning;
  document.getElementById('start-learn-btn').textContent = aiLearning ? 'Stop Learning' : 'Start Learning';
});

document.getElementById('ai-epsilon').addEventListener('input', (e) => {
  aiEpsilon = parseFloat(e.target.value);
  document.getElementById('ai-epsilon-val').textContent = aiEpsilon.toFixed(2);
});

document.getElementById('ai-alpha').addEventListener('input', (e) => {
  aiAlpha = parseFloat(e.target.value);
  document.getElementById('ai-alpha-val').textContent = aiAlpha.toFixed(2);
});

document.getElementById('ai-gamma').addEventListener('input', (e) => {
  aiGamma = parseFloat(e.target.value);
  document.getElementById('ai-gamma-val').textContent = aiGamma.toFixed(2);
});

document.getElementById('turbo-steps').addEventListener('input', (e) => {
  document.getElementById('turbo-steps-val').textContent = e.target.value;
});

document.getElementById('rl-pause-log').addEventListener('change', (e) => {
  aiLogPaused = e.target.checked;
});

window.addEventListener('beforeunload', () => { saveRunAndReport(); });

document.getElementById('save-run-btn').addEventListener('click', () => {
  saveRunAndReport();
});

document.getElementById('export-btn').addEventListener('click', exportPolicy);
document.getElementById('reset-policy-btn').addEventListener('click', resetPolicy);

document.getElementById('import-btn').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        if (importPolicy(ev.target.result)) {
          updateMetrics();
          drawSparkline();
        }
      };
      reader.readAsText(file);
    }
  };
  input.click();
});

// Init
if (!loadConfig()) {
  config = configFromDefaults();
}
if (!loadRun()) {
  loadQTable();
  initQTable();
}
buildSliders();
buildPresets();
updateDerivedValues();
updateMetrics();
drawSparkline();
initGame();
requestAnimationFrame(gameLoop);

</script>
</html>
