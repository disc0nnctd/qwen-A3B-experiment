<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Don't Touch The Spikes</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { max-width: 100%; max-height: 100vh; object-fit: contain; }
#config-toggle {
  position: fixed; top: 10px; right: 10px; z-index: 100;
  background: #2c3e50; color: #fff; border: 2px solid #3498db;
  border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 14px;
  font-family: Arial, sans-serif; transition: all 0.2s;
}
#config-toggle:hover { background: #3498db; }
#config-panel {
  position: fixed; top: 0; right: 0; z-index: 99;
  width: 320px; height: 100vh; background: rgba(20, 20, 40, 0.97);
  border-left: 2px solid #3498db; overflow-y: auto;
  transform: translateX(100%); transition: transform 0.3s ease;
  padding: 50px 20px 20px; font-family: Arial, sans-serif;
}
#config-panel.open { transform: translateX(0); }
#config-panel h2 { color: #3498db; font-size: 18px; margin-bottom: 20px; text-align: center; }
.config-group { margin-bottom: 18px; }
.config-group label {
  display: flex; justify-content: space-between; align-items: center;
  color: #ecf0f1; font-size: 13px; margin-bottom: 4px;
}
.config-group label span.val { color: #3498db; font-weight: bold; min-width: 40px; text-align: right; }
.config-group input[type="range"] {
  width: 100%; height: 6px; -webkit-appearance: none; appearance: none;
  background: #2c3e50; border-radius: 3px; outline: none; cursor: pointer;
}
.config-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
  background: #3498db; border-radius: 50%; cursor: pointer; border: 2px solid #2980b9;
}
.config-group input[type="range"]::-moz-range-thumb {
  width: 18px; height: 18px; background: #3498db; border-radius: 50%;
  cursor: pointer; border: 2px solid #2980b9;
}
.config-group input[type="number"] {
  width: 60px; background: #2c3e50; color: #3498db; border: 1px solid #3498db;
  border-radius: 4px; padding: 2px 4px; font-size: 12px; text-align: center;
  font-family: monospace;
}
.config-divider {
  border: none; border-top: 1px solid #3498db33; margin: 18px 0;
}
.config-section-title {
  color: #e67e22; font-size: 14px; font-weight: bold; margin-bottom: 12px;
  text-transform: uppercase; letter-spacing: 1px;
}
#reset-btn {
  width: 100%; padding: 8px; background: #e74c3c; color: #fff; border: none;
  border-radius: 6px; cursor: pointer; font-size: 13px; font-family: Arial;
  margin-top: 10px; transition: background 0.2s;
}
#reset-btn:hover { background: #c0392b; }
</style>
</head>
<body>
<canvas id="game" width="540" height="960"></canvas>
<button id="config-toggle">⚙ Config</button>
<div id="config-panel">
  <h2>⚙ Physics Config</h2>
  <div class="config-section-title">Gravity</div>
  <div class="config-group">
    <label>Gravity (px/s²) <span class="val" id="gravity-val">27</span></label>
    <input type="range" id="gravity-slider" min="1" max="80" step="1" value="27">
    <input type="number" id="gravity-num" min="1" max="80" step="1" value="27">
  </div>
  <div class="config-group">
    <label>Jump Force (px/s) <span class="val" id="flap-val">-510</span></label>
    <input type="range" id="flap-slider" min="-1000" max="-100" step="10" value="-510">
    <input type="number" id="flap-num" min="-1000" max="-100" step="10" value="-510">
  </div>
  <div class="config-group">
    <label>Horizontal Speed (px/s) <span class="val" id="vx-val">270</span></label>
    <input type="range" id="vx-slider" min="50" max="500" step="10" value="270">
    <input type="number" id="vx-num" min="50" max="500" step="10" value="270">
  </div>
  <hr class="config-divider">
  <div class="config-section-title">Bird</div>
  <div class="config-group">
    <label>Bird Radius (px) <span class="val" id="bird-r-val">16</span></label>
    <input type="range" id="bird-r-slider" min="8" max="30" step="1" value="16">
    <input type="number" id="bird-r-num" min="8" max="30" step="1" value="16">
  </div>
  <hr class="config-divider">
  <div class="config-section-title">Spike</div>
  <div class="config-group">
    <label>Spike Width (px) <span class="val" id="spike-w-val">30</span></label>
    <input type="range" id="spike-w-slider" min="10" max="60" step="1" value="30">
    <input type="number" id="spike-w-num" min="10" max="60" step="1" value="30">
  </div>
  <div class="config-group">
    <label>Spike Height (px) <span class="val" id="spike-h-val">24</span></label>
    <input type="range" id="spike-h-slider" min="10" max="50" step="1" value="24">
    <input type="number" id="spike-h-num" min="10" max="50" step="1" value="24">
  </div>
  <hr class="config-divider">
  <div class="config-section-title">Candy</div>
  <div class="config-group">
    <label>Candy Radius (px) <span class="val" id="candy-r-val">12</span></label>
    <input type="range" id="candy-r-slider" min="6" max="25" step="1" value="12">
    <input type="number" id="candy-r-num" min="6" max="25" step="1" value="12">
  </div>
  <div class="config-group">
    <label>Candy Spawn Chance (%) <span class="val" id="candy-chance-val">50</span></label>
    <input type="range" id="candy-chance-slider" min="0" max="100" step="5" value="50">
    <input type="number" id="candy-chance-num" min="0" max="100" step="5" value="50">
  </div>
  <hr class="config-divider">
  <div class="config-section-title">Difficulty</div>
  <div class="config-group">
    <label>Wall Border (px) <span class="val" id="wall-border-val">12</span></label>
    <input type="range" id="wall-border-slider" min="5" max="30" step="1" value="12">
    <input type="number" id="wall-border-num" min="5" max="30" step="1" value="12">
  </div>
  <div class="config-group">
    <label>Min Spikes (Easy) <span class="val" id="min-spike-val">2</span></label>
    <input type="range" id="min-spike-slider" min="1" max="5" step="1" value="2">
    <input type="number" id="min-spike-num" min="1" max="5" step="1" value="2">
  </div>
  <div class="config-group">
    <label>Max Spikes (Easy) <span class="val" id="max-spike-val">3</span></label>
    <input type="range" id="max-spike-slider" min="2" max="6" step="1" value="3">
    <input type="number" id="max-spike-num" min="2" max="6" step="1" value="3">
  </div>
  <button id="reset-btn">Reset to Defaults</button>
</div>
<script>
// --- CONFIG PANEL ---
const configToggle = document.getElementById('config-toggle');
const configPanel = document.getElementById('config-panel');
let configOpen = false;

configToggle.addEventListener('click', () => {
  configOpen = !configOpen;
  configPanel.classList.toggle('open', configOpen);
});

const defaults = {
  gravity: 27, flap: -510, vx: 270, birdR: 16,
  spikeW: 30, spikeH: 24, candyR: 12, candyChance: 50,
  wallBorder: 12, minSpike: 2, maxSpike: 3
};

let config = { ...defaults };

function syncSliderToNum(sliderId, numId) {
  const slider = document.getElementById(sliderId);
  const num = document.getElementById(numId);
  slider.addEventListener('input', () => {
    num.value = slider.value;
  });
  num.addEventListener('input', () => {
    slider.value = num.value;
  });
}

function setupConfig(key, sliderId, numId, valId, displayFn) {
  const slider = document.getElementById(sliderId);
  const num = document.getElementById(numId);
  const valEl = document.getElementById(valId);
  syncSliderToNum(sliderId, numId);
  slider.addEventListener('input', () => {
    config[key] = parseFloat(slider.value);
    valEl.textContent = displayFn(config[key]);
  });
  num.addEventListener('input', () => {
    config[key] = parseFloat(num.value);
    valEl.textContent = displayFn(config[key]);
  });
  valEl.textContent = displayFn(config[key]);
}

function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

setupConfig('gravity', 'gravity-slider', 'gravity-num', 'gravity-val', v => clamp(v, 1, 80));
setupConfig('flap', 'flap-slider', 'flap-num', 'flap-val', v => clamp(v, -1000, -100));
setupConfig('vx', 'vx-slider', 'vx-num', 'vx-val', v => clamp(v, 50, 500));
setupConfig('birdR', 'bird-r-slider', 'bird-r-num', 'bird-r-val', v => clamp(v, 8, 30));
setupConfig('spikeW', 'spike-w-slider', 'spike-w-num', 'spike-w-val', v => clamp(v, 10, 60));
setupConfig('spikeH', 'spike-h-slider', 'spike-h-num', 'spike-h-val', v => clamp(v, 10, 50));
setupConfig('candyR', 'candy-r-slider', 'candy-r-num', 'candy-r-val', v => clamp(v, 6, 25));
setupConfig('candyChance', 'candy-chance-slider', 'candy-chance-num', 'candy-chance-val', v => clamp(v, 0, 100));
setupConfig('wallBorder', 'wall-border-slider', 'wall-border-num', 'wall-border-val', v => clamp(v, 5, 30));
setupConfig('minSpike', 'min-spike-slider', 'min-spike-num', 'min-spike-val', v => clamp(v, 1, 5));
setupConfig('maxSpike', 'max-spike-slider', 'max-spike-num', 'max-spike-val', v => clamp(v, 2, 6));

document.getElementById('reset-btn').addEventListener('click', () => {
  config = { ...defaults };
  for (const key of Object.keys(defaults)) {
    const slider = document.getElementById(key + '-slider');
    const num = document.getElementById(key + '-num');
    if (slider) slider.value = defaults[key];
    if (num) num.value = defaults[key];
  }
  for (const key of Object.keys(defaults)) {
    document.getElementById(key + '-val').textContent = defaults[key];
  }
});

// --- GAME ---
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 540, H = 960;
const SLOT_H = H / 11;
const WALL_BORDER = config.wallBorder;
const CANDY_COLOR = '#f1c40f';
const WALL_COLOR = '#95a5a6';
const BIRD_COLOR = '#ff6b35';
const SPIKE_COLOR = '#e74c3c';

// Game State
const START_MENU = 0, GAMEPLAY = 1, GAME_OVER = 2;
let state = START_MENU;
let score = 0;
let highScore = parseInt(localStorage.getItem('dqts_highscore')) || 0;
let candyCount = parseInt(localStorage.getItem('dqts_candies')) || 0;
let screenShake = { x: 0, y: 0, frames: 0 };
let gameOverAnim = { active: false, time: 0, birdY: 0, birdAngle: 0, whiteFlash: 0 };
let particles = [];
let bird = { x: W / 2, y: H / 2, vx: config.vx, vy: 0 };
let rightWallSpikes = [];
let leftWallSpikes = [];
let rightWallHasSpikes = true;
let candy = null;
let gameTime = 0;
let lastTime = 0;
let scoreFlash = 0;

function initGame() {
  bird = { x: W / 2, y: H / 2, vx: config.vx, vy: 0 };
  score = 0;
  screenShake = { x: 0, y: 0, frames: 0 };
  gameOverAnim = { active: false, time: 0, birdY: H / 2, birdAngle: 0, whiteFlash: 0 };
  particles = [];
  candy = null;
  rightWallSpikes = [];
  leftWallSpikes = [];
  rightWallHasSpikes = true;
  scoreFlash = 0;
  initWalls();
}

function initWalls() {
  rightWallSpikes = [];
  leftWallSpikes = [];
  rightWallHasSpikes = true;
  spawnSpikeWall(leftWallSpikes, WALL_BORDER + 15);
}

function spawnSpikeWall(wallSpikes, x) {
  wallSpikes = [];
  const diff = score <= 5 ? [config.minSpike, config.maxSpike] : score <= 15 ? [3, 4] : [4, 5];
  const count = diff[0] + Math.floor(Math.random() * (diff[1] - diff[0] + 1));
  const availableSlots = [];
  for (let i = 1; i < 10; i++) {
    const hasSpike = wallSpikes.some(s => Math.floor(s.y / SLOT_H) === i);
    if (!hasSpike) availableSlots.push(i);
  }
  const shuffled = availableSlots.sort(() => Math.random() - 0.5);
  for (let i = 0; i < Math.min(count, shuffled.length); i++) {
    const slot = shuffled[i];
    const slotY = slot * SLOT_H + SLOT_H / 2;
    wallSpikes.push({ x: x, y: slotY, dir: x >= W / 2 ? -1 : 1 });
  }
  return wallSpikes;
}

function spawnCandy() {
  if (candy) return;
  if (Math.random() > config.candyChance / 100) return;
  const hasSpikes = rightWallHasSpikes ? rightWallSpikes : leftWallSpikes;
  const x = rightWallHasSpikes ? W - WALL_BORDER - 40 : WALL_BORDER + 40;
  const safeSlots = [];
  for (let i = 1; i < 10; i++) {
    const slotY = i * SLOT_H + SLOT_H / 2;
    const hasSpike = hasSpikes.some(s => Math.floor(s.y / SLOT_H) === i);
    if (!hasSpike) safeSlots.push(slotY);
  }
  if (safeSlots.length === 0) return;
  const y = safeSlots[Math.floor(Math.random() * safeSlots.length)];
  candy = { x, y, angle: 0 };
}

function addParticles(x, y, color, count, type) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = type === 'candy' ? 1.5 + Math.random() * 2 : 2 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: type === 'candy' ? -Math.random() * 3 - 1 : Math.sin(angle) * speed,
      life: 1,
      decay: 0.02 + Math.random() * 0.02,
      size: type === 'candy' ? 3 + Math.random() * 3 : 4 + Math.random() * 4,
      color,
      type
    });
  }
}

function shakeScreen() {
  screenShake = { x: (Math.random() - 0.5) * 10, y: (Math.random() - 0.5) * 10, frames: 8 };
}

function flap() {
  if (state === START_MENU) {
    state = GAMEPLAY;
    initGame();
    return;
  }
  if (state === GAME_OVER) {
    state = GAMEPLAY;
    initGame();
    return;
  }
  if (state !== GAMEPLAY) return;
  bird.vy = config.flap;
  addParticles(bird.x, bird.y + config.birdR, WALL_COLOR, 6, 'wall');
}

document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); flap(); } });
canvas.addEventListener('click', flap);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); });

function checkSpikeCollision() {
  const spikes = [...rightWallSpikes, ...leftWallSpikes];
  for (const s of spikes) {
    if (bird.x + config.birdR > s.x - config.spikeW / 2 && bird.x - config.birdR < s.x + config.spikeW / 2 &&
        bird.y + config.birdR > s.y - config.spikeH && bird.y - config.birdR < s.y) {
      return true;
    }
  }
  return false;
}

function checkCandyCollection() {
  if (!candy) return;
  const dx = bird.x - candy.x, dy = bird.y - candy.y;
  if (Math.sqrt(dx * dx + dy * dy) < config.birdR + config.candyR) {
    candyCount++;
    localStorage.setItem('dqts_candies', candyCount);
    addParticles(candy.x, candy.y, CANDY_COLOR, 10, 'candy');
    candy = null;
  }
}

function checkWallCollision() {
  if (bird.x + config.birdR > W - WALL_BORDER) {
    bird.x = W - WALL_BORDER - config.birdR;
    bird.vx = -config.vx;
    shakeScreen();
    addParticles(bird.x + config.birdR, bird.y, WALL_COLOR, 6, 'wall');
    scoreFlash = 1;
    score++;
    rightWallHasSpikes = false;
    rightWallSpikes = spawnSpikeWall([], WALL_BORDER + 15);
    spawnCandy();
  }
  if (bird.x - config.birdR < WALL_BORDER) {
    bird.x = WALL_BORDER + config.birdR;
    bird.vx = config.vx;
    shakeScreen();
    addParticles(bird.x - config.birdR, bird.y, WALL_COLOR, 6, 'wall');
    scoreFlash = 1;
    score++;
    rightWallHasSpikes = true;
    rightWallSpikes = spawnSpikeWall([], W - WALL_BORDER - 15);
    spawnCandy();
  }
  if (bird.y - config.birdR < config.spikeH) {
    bird.y = config.spikeH + config.birdR;
    bird.vy = Math.abs(bird.vy) * 0.5;
  }
  if (bird.y + config.birdR > H - config.spikeH) {
    bird.y = H - config.spikeH - config.birdR;
    bird.vy = -Math.abs(bird.vy) * 0.5;
  }
}

function gameOver() {
  state = GAME_OVER;
  gameOverAnim = { active: true, time: 0, birdY: bird.y, birdAngle: 0, whiteFlash: 1 };
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('dqts_highscore', highScore);
  }
}

function update(dt) {
  if (state === START_MENU) {
    bird.y = H / 2 + Math.sin(gameTime * 2) * 15;
    return;
  }
  if (state === GAME_OVER) {
    gameOverAnim.time += dt;
    gameOverAnim.whiteFlash *= 0.95;
    if (gameOverAnim.time < 0.5) {
      gameOverAnim.birdAngle += 10 * dt;
    } else {
      gameOverAnim.birdY += 8 * dt;
    }
    return;
  }
  scoreFlash *= 0.9;
  bird.vy += config.gravity * dt;
  bird.x += bird.vx * dt;
  bird.y += bird.vy * dt;
  checkWallCollision();
  if (checkSpikeCollision()) {
    gameOver();
    return;
  }
  checkCandyCollection();
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.type === 'candy') p.vy -= 0.05;
    p.life -= p.decay;
    return p.life > 0;
  });
  if (screenShake.frames > 0) {
    screenShake.frames--;
    if (screenShake.frames <= 0) {
      screenShake = { x: 0, y: 0, frames: 0 };
    }
  }
  if (candy) candy.angle += 0.03;
  gameTime += dt;
}

function drawSpike(x, y, dir) {
  ctx.fillStyle = SPIKE_COLOR;
  ctx.beginPath();
  ctx.moveTo(x - config.spikeW / 2, y + dir * config.spikeH / 2);
  ctx.lineTo(x + config.spikeW / 2, y + dir * config.spikeH / 2);
  ctx.lineTo(x, y - dir * config.spikeH / 2);
  ctx.closePath();
  ctx.fill();
}

function drawBird(x, y, vx) {
  const dir = vx > 0 ? 1 : -1;
  ctx.fillStyle = BIRD_COLOR;
  ctx.beginPath();
  ctx.arc(x, y, config.birdR, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x + dir * 5, y - 4, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x + dir * 7, y - 4, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f39c12';
  ctx.beginPath();
  ctx.moveTo(x + dir * 16, y - 1);
  ctx.lineTo(x + dir * 24, y + 2);
  ctx.lineTo(x + dir * 16, y + 5);
  ctx.closePath();
  ctx.fill();
}

function drawCandy(x, y, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = CANDY_COLOR;
  ctx.beginPath();
  ctx.moveTo(0, -config.candyR);
  ctx.lineTo(config.candyR, 0);
  ctx.lineTo(0, config.candyR);
  ctx.lineTo(-config.candyR, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.save();
  if (screenShake.frames > 0) {
    ctx.translate(screenShake.x, screenShake.y);
  }
  ctx.fillStyle = '#ecef1';
  ctx.fillRect(-10, -10, W + 20, H + 20);
  if (state === GAMEPLAY) {
    ctx.fillStyle = 'rgba(0,0,0,0.04)';
    ctx.font = 'bold 180px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(score, W / 2, H / 2);
  }
  if (scoreFlash > 0.1) {
    ctx.fillStyle = `rgba(39, 174, 96, ${scoreFlash * 0.15})`;
    ctx.fillRect(-10, -10, W + 20, H + 20);
  }
  const spikes = rightWallHasSpikes ? rightWallSpikes : leftWallSpikes;
  for (const s of spikes) {
    drawSpike(s.x, s.y, s.dir);
  }
  const oppositeSpikes = rightWallHasSpikes ? leftWallSpikes : rightWallSpikes;
  for (const s of oppositeSpikes) {
    drawSpike(s.x, s.y, s.dir);
  }
  ctx.strokeStyle = WALL_COLOR;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(WALL_BORDER, 0);
  ctx.lineTo(WALL_BORDER, H);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(W - WALL_BORDER, 0);
  ctx.lineTo(W - WALL_BORDER, H);
  ctx.stroke();
  if (candy) drawCandy(candy.x, candy.y, candy.angle);
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    if (p.type === 'candy') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
  if (state === GAME_OVER) {
    ctx.save();
    ctx.translate(W / 2, gameOverAnim.birdY);
    ctx.rotate(gameOverAnim.birdAngle);
    drawBird(0, 0, 1);
    ctx.restore();
  } else if (state === START_MENU) {
    drawBird(bird.x, bird.y, bird.vx);
  } else {
    drawBird(bird.x, bird.y, bird.vx);
  }
  if (state === START_MENU) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText("DON'T TOUCH", W / 2, H / 2 - 80);
    ctx.fillText("THE SPIKES", W / 2, H / 2 - 30);
    ctx.font = 'bold 36px Arial';
    ctx.fillStyle = '#f1c40f';
    ctx.fillText("HIGH: " + highScore, W / 2, H / 2 + 30);
    ctx.font = '24px Arial';
    ctx.fillStyle = '#fff';
    const pulse = Math.sin(gameTime * 3) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.fillText("Tap to Jump", W / 2, H / 2 + 90);
    ctx.globalAlpha = 1;
  }
  if (state === GAME_OVER) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    const cardW = 340, cardH = 260;
    const cardX = W / 2 - cardW / 2, cardY = H / 2 - cardH / 2;
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.roundRect(cardX, cardY, cardW, cardH, 16);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 36px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText("GAME OVER", W / 2, cardY + 50);
    ctx.font = '28px Arial';
    ctx.fillStyle = '#e74c3c';
    ctx.fillText("Score: " + score, W / 2, cardY + 100);
    ctx.font = '22px Arial';
    ctx.fillStyle = '#2c3e50';
    ctx.fillText("Best: " + highScore, W / 2, cardY + 140);
    ctx.fillText("Candies: " + candyCount, W / 2, cardY + 175);
    const btnW = 200, btnH = 45;
    const btnX = W / 2 - btnW / 2, btnY = cardY + cardH - 60;
    const hover = Math.sin(gameTime * 4) * 2;
    ctx.fillStyle = '#27ae60';
    ctx.beginPath();
    ctx.roundRect(btnX, btnY + hover, btnW, btnH, 8);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial';
    ctx.fillText("Play Again", W / 2, btnY + btnH / 2 + hover);
  }
  ctx.restore();
}

function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  gameTime += dt;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

initGame();
requestAnimationFrame(gameLoop);
</script>
